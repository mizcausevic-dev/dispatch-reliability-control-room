name: OpenSSF Scorecard

# Automated security posture scoring against the OpenSSF Scorecard ruleset:
#   https://github.com/ossf/scorecard
#
# Score appears in the Security tab + can be embedded as a badge.
# Catches regressions in: dangerous workflows, missing branch protection,
# unpinned actions, weak deps, exposed secrets, missing license, etc.
#
# Triggers:
#   - branch_protection_rule (fires when branch protection config changes)
#   - Weekly Saturday cron (keeps the score fresh as new checks ship)
#   - Push to main (catches just-shipped regressions)

on:
  branch_protection_rule:
  schedule:
    - cron: "0 13 * * 6"
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history needed by Scorecard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2
        continue-on-error: true
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results: false avoids the public Scorecard API's
          # Sigstore/Fulcio transparency-log signing step, whose strict
          # workflow-permissions check has been failing here for reasons
          # outside this repo's security posture. SARIF is still generated
          # and uploaded to the Security tab below.
          publish_results: false

      - name: Upload SARIF (so Security tab shows findings)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v3
        with:
          sarif_file: results.sarif

      - name: Upload artifact (raw JSON downloadable from the run)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 30
